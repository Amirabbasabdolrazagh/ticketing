services:
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:latest
    container_name: itrasam-meshcentral
    restart: unless-stopped
    environment:
      DYNAMIC_CONFIG: "false"
    ports:
      - "127.0.0.1:4430:4430"
    volumes:
      - ./meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      # Versioned, upgrade-safe visual overrides for the branded portal.
      - ./meshcentral-web:/opt/meshcentral/meshcentral-web
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4430/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  meshcentral-files:
  meshcentral-backups:
