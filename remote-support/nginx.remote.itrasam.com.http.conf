server {
    listen 80;
    listen [::]:80;
    server_name remote.itrasam.com;

    # This temporary configuration is used only while Certbot obtains the
    # first certificate. Replace it with nginx.remote.itrasam.com.conf after
    # Certbot completes successfully.
    location / {
        return 200 "Remote support certificate setup is in progress.\n";
        add_header Content-Type text/plain;
    }
}
