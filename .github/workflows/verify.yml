name: Verify ticketing changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
