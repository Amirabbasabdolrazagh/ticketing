server {
    listen 80;
    server_name phone.itrasam.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name phone.itrasam.com;

    ssl_certificate /etc/letsencrypt/live/phone.itrasam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phone.itrasam.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / {
        return 302 /phone;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Only the WebSocket endpoint is relayed; Issabel itself remains private.
    location /sip-wss {
        proxy_pass https://192.168.3.5:8089/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
}
