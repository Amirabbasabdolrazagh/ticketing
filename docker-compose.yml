services:
  ticketing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itrasam-ticketing
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    volumes:
      - ./storage/ticket-attachments:/app/storage/ticket-attachments
      - ./storage/project-assessments:/app/storage/project-assessments
      - ./storage/call-recordings:/app/storage/call-recordings
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  phone:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itrasam-phone
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      PHONE_APP_MODE: "1"
      PHONE_TRANSCRIPTION_FAST_URL: "http://127.0.0.1:9002"
    volumes:
      - ./storage/ticket-attachments:/app/storage/ticket-attachments
      - ./storage/project-assessments:/app/storage/project-assessments
      - ./storage/call-recordings:/app/storage/call-recordings
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/phone || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  voice-transcription-fast:
    build:
      context: ./services/voice-transcription-fast
      dockerfile: Dockerfile
    container_name: itrasam-voice-fast-phone
    restart: unless-stopped
    environment:
      VOICE_THREADS: 4
    ports:
      - "127.0.0.1:9002:9000"
    volumes:
      - voice-transcription-fast-models:/models
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  mongodb:
    image: mongo:8
    container_name: itrasam-mongodb
    restart: unless-stopped
    env_file:
      - .mongo.env
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ticketing-mongo-data:/data/db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  ticketing-mongo-data:
  voice-transcription-fast-models:
    name: itrasam-voice-trial_voice-transcription-fast-models
