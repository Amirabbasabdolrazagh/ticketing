services:
  ticketing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itrasam-ticketing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./storage/ticket-attachments:/app/storage/ticket-attachments
      - ./storage/project-assessments:/app/storage/project-assessments
      - ./storage/accounting-archive:/app/storage/accounting-archive
      - ./storage/call-recordings:/app/storage/call-recordings
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  phone:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itrasam-phone
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      PHONE_APP_MODE: "1"
      PHONE_TRANSCRIPTION_FAST_URL: ${PHONE_TRANSCRIPTION_FAST_URL:-http://voice-transcription-fast:9000}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./storage/ticket-attachments:/app/storage/ticket-attachments
      - ./storage/project-assessments:/app/storage/project-assessments
      - ./storage/call-recordings:/app/storage/call-recordings
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/phone || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  voice-transcription-fast:
    build:
      context: ./services/voice-transcription-fast
      dockerfile: Dockerfile
    container_name: itrasam-voice-fast-phone
    restart: unless-stopped
    environment:
      VOICE_THREADS: 4
    volumes:
      - voice-transcription-fast-models:/models
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  voice-transcription-fast-models:
    name: itrasam-voice-trial_voice-transcription-fast-models
