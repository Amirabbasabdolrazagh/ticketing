services:
  ticketing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itrasam-ticketing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./storage/ticket-attachments:/app/storage/ticket-attachments
      - ./storage/project-assessments:/app/storage/project-assessments
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  voice-transcription:
    build:
      context: ./services/voice-transcription
      dockerfile: Dockerfile
    container_name: itrasam-voice-transcription
    restart: unless-stopped
    environment:
      VOICE_MODEL: small
    volumes:
      - voice-transcription-models:/models
    ports:
      - "127.0.0.1:9000:9000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  voice-transcription-models:
